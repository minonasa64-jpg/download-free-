name: pro_downloader
description: A new Flutter project for downloading videos.

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: any
  path_provider: any
  permission_handler: any
  share_plus: any
  youtube_explode_dart: any
  video_player: any
  chewie: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "icon.png"
  min_sdk_android: 21
