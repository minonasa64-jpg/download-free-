name: pro_downloader
description: A new Flutter project for downloading videos.

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  share_plus: ^8.0.3
  youtube_explode_dart: ^2.5.3
  video_player: ^2.8.2
  chewie: ^1.7.5
  shared_preferences: ^2.2.2
  video_thumbnail: ^0.5.3
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.1.2
  google_mobile_ads: ^9.0.0 # مكتبة إعلانات جوجل الرسمية



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "icon.png"
  min_sdk_android: 21
