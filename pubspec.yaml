name: pro_downloader
description: "A new Flutter project for downloading videos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  dio: ^5.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  share_plus: ^8.0.3
  shared_preferences: ^2.2.2

  youtube_explode_dart: ^2.5.3

  # استخدام إصدار أقدم ومستقر من مكتبة FFmpeg
  ffmpeg_kit_flutter: ^5.1.0

  video_player: ^2.8.2
  chewie: 1.7.5
  video_thumbnail: ^0.5.3
  audioplayers: ^5.2.1

  flutter_local_notifications: ^17.1.2
  google_mobile_ads: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
