<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form UI | CodeByGaurav</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- Login Form -->
            <div class="form-panel login-panel">
                <div class="logo">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your journey</p>

                <form id="loginForm">
                    <!-- Email -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
                        <label for="loginEmail">
                            Email Address
                        </label>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password"
                            required>
                        <label for="loginPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                            <i id="loginEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox" checked>
                            Remember me
                        </label>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="main-btn">
                        Login
                    </button>

                    <!-- Google Sign In -->
                    <button type="button" class="google-btn" onclick="handleGoogleLogin()">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/768px-Google_%22G%22_logo.svg.png" alt="Google" width="20" height="20">
                        <span>Sign in with Google</span>
                    </button>
                </form>

                <div class="switch-area">
                    <span>
                        Don't have an account?
                    </span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Sign Up -->
            <div class="form-panel signup-panel">
                <div class="logo">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1>Create Account</h1>
                <p class="subtitle">
                    Start your journey with us
                </p>

                <form id="signupForm">
                    <!-- Name -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="signupName" placeholder=" " autocomplete="name" required>
                        <label for="signupName">
                            Full Name
                        </label>
                    </div>

                    <!-- Email -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="signupEmail" placeholder=" " autocomplete="email" required>
                        <label for="signupEmail">
                           Email Address
                        </label>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" placeholder=" " autocomplete="new-password"
                            required>
                        <label for="signupPassword">
                            Password
                        </label>
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                            <i id="signupEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <!-- Confirm -->
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password"
                            required>
                        <label for="confirmPassword">
                           Confirm Password
                        </label>
                    </div>

                    <button type="submit" class="main-btn">CREATE ACCOUNT</button>

                    <!-- Google Sign In -->
                    <button type="button" class="google-btn" onclick="handleGoogleLogin()">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/768px-Google_%22G%22_logo.svg.png" alt="Google" width="20" height="20">
                        <span>Sign up with Google</span>
                    </button>
                </form>

                <div class="switch-area">
                    <span>
                        Already have an account?
                    </span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
