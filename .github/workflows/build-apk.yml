name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create --no-pub --project-name pro_downloader --org com.boykta --platforms=android .

      - name: Safely Inject Manifest and PiP Data
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          
          perms = [
              'android.permission.INTERNET',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'com.google.android.gms.permission.AD_ID',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC'
          ]
          for p in perms:
              e = ET.Element('uses-permission')
              e.set('{http://schemas.android.com/apk/res/android}name', p)
              root.insert(0, e)
              
          app = root.find('application')
          if app is not None:
              app.set('{http://schemas.android.com/apk/res/android}largeHeap', 'true')
              app.set('{http://schemas.android.com/apk/res/android}requestLegacyExternalStorage', 'true')
              ad = ET.Element('meta-data')
              ad.set('{http://schemas.android.com/apk/res/android}name', 'com.google.android.gms.ads.APPLICATION_ID')
              ad.set('{http://schemas.android.com/apk/res/android}value', 'ca-app-pub-3940256099942544~3347511713')
              app.append(ad)

              for act in app.findall('activity'):
                  act.set('{http://schemas.android.com/apk/res/android}supportsPictureInPicture', 'true')
                  act.set('{http://schemas.android.com/apk/res/android}configChanges', 'orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode')
              
          tree.write(path, encoding='utf-8', xml_declaration=True)
          "

      - name: Setup FlutterFragmentActivity and PiP Channel
        run: |
          find android/app/src/main -name "MainActivity.kt" | while read file; do
            cat << 'EOF' > "$file"
          package com.boykta.pro_downloader

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugins.GeneratedPluginRegistrant

          class MainActivity: FlutterFragmentActivity() {
              private val CHANNEL = "com.boykta.app/pip"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  try {
                      GeneratedPluginRegistrant.registerWith(flutterEngine)
                  } catch (e: Exception) {
                      android.util.Log.e("MainActivity", "Plugin registration error: ${e.message}")
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "enterPip") {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              try {
                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(16, 9))
                                      .build()
                                  enterPictureInPictureMode(params)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("PIP_ERROR", e.message, null)
                              }
                          } else {
                              result.error("NOT_SUPPORTED", "PiP requires Android Oreo (API 26) or higher", null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF
          done

      - name: Apply FFmpeg Resolution Strategy and Build Fixes
        run: |
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'com.arthenica') {
                          if (details.requested.name.contains('ffmpeg-kit')) {
                              details.useTarget group: 'dev.ffmpegkit-maintained', name: details.requested.name, version: '8.1.7'
                          } else {
                              details.useTarget group: 'dev.ffmpegkit-maintained', name: 'ffmpeg-kit-full', version: '8.1.7'
                          }
                      }
                  }
              }
          }
          EOF
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minifyEnabled\s+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i -E 's/shrinkResources\s+true/shrinkResources false/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -dontwarn io.flutter.embedding.**
          -keep class io.flutter.plugins.GeneratedPluginRegistrant { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          -keep class * implements io.flutter.embedding.engine.plugins.FlutterPlugin { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.4"
          RELEASE_TITLE="Boykta Pro v1.2.4 - إصلاح مشغل فيديو يوتيوب والتنزيل التوربو"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          NOTES="🚀 **Boykta Pro v1.2.4** - التحديث المستقر مع إصلاحات شاملة لمشغل يوتيوب والتنزيل!

          ### ✨ أبرز الإصلاحات والتحسينات في هذا التحديث:
          - 🎬 **إصلاح مشغل فيديو يوتيوب:** حل مشكلة خطأ القنوات (PlatformException channel-error) وتشغيل الفيديوهات بجودة عالية وتوافق فوري مع جميع أجهزة أندرويد عبر المشغل المدمج.
          - ⚡ **تحسين التنزيل السريع والمتعدد:** حل مشكلة انقطاع التنزيل أو استثناءات الصلاحيات على إصدارات أندرويد الحديثة وتوفير مسارات بديلة فورية.
          - 🛠️ **حماية الدمج الصوتي والمرئي:** نسخ وحفظ ملفات الفيديو مباشرة حتى في حال عدم دعم FFmpeg لجهاز معين لضمان نجاح التحميل بنسبة 100%.
          - 🎛️ **التحكم بخطوط التحميل وخلفية النظام:** كامل ميزات الـ Multi-Threaded Turbo، التنزيل في الخلفية، والمتصفح الذكي، والخزنة الرقمية.
          
          📲 **التثبيت المباشر:** قم بتحميل ملف \`app-release.apk\` المرفق أدناه وتثبيته مباشرة على هاتفك الأندرويد."

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber || true
          else
            gh release create "$TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$NOTES"
          fi
