name: Build Flutter APK

# متى يتم تشغيل هذا البناء؟
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل البناء يدوياً من واجهة جيت هاب بضغطة زر

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest # الخادم الذي سنستخدمه من مايكروسوفت

    steps:
      - name: 📥 سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة جافا (مطلوبة لبرمجة الأندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # أفضل إصدار مستقر حالياً مع فلاتر والأندرويد

      - name: 🐦 إعداد بيئة فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # استخدام أحدث نسخة مستقرة من فلاتر

      - name: 📦 تحميل الحزم والمكتبات
        run: flutter pub get

      - name: 🛠️ بناء ملف APK بصيغة الإصدار (Release)
        run: flutter build apk --release

      - name: 📤 رفع ملف الـ APK النهائي كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
