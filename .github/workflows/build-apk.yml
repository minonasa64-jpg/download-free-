name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create --no-pub --project-name pro_downloader --org com.boykta --platforms=android .

      - name: Safely Inject Manifest and PiP Data
        run: python3 scripts/inject_manifest.py

      - name: Setup FlutterFragmentActivity, PiP and Native MediaMuxer Channels
        run: |
          python3 scripts/setup_activity.py
          find android/app/src/main -name "MainActivity.kt" -exec rm -f {} +

      - name: Apply FFmpeg Resolution Strategy and Build Fixes
        run: |
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'com.arthenica' || details.requested.group == 'dev.ffmpegkit-maintained') {
                          details.useTarget group: 'dev.ffmpegkit-maintained', name: 'ffmpeg-kit-full', version: '8.1.7'
                      }
                  }
              }
          }
          EOF
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "com\.android\.application" version "[0-9.]+"/id "com.android.application" version "7.4.2"/g' android/settings.gradle || true
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext\.kotlin_version\s*=\s*'[^']+'/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true
            sed -i -E "s/kotlin-gradle-plugin:[0-9.]+/kotlin-gradle-plugin:2.0.21/g" android/build.gradle || true
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/g" android/build.gradle || true
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E 's/gradle-[0-9.]+-all\.zip/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdkVersion\s+[0-9]+/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdkVersion\s+flutter\.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minifyEnabled\s+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i -E 's/shrinkResources\s+true/shrinkResources false/g' android/app/build.gradle || true
            echo 'tasks.whenTaskAdded { task -> if (task.name.toLowerCase().contains("aarmetadata")) { task.enabled = false } }' >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -dontwarn io.flutter.embedding.**
          -keep class io.flutter.plugins.GeneratedPluginRegistrant { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          -keep class dev.ffmpegkit.** { *; }
          -dontwarn dev.ffmpegkit.**
          -keep class * implements io.flutter.embedding.engine.plugins.FlutterPlugin { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }
          -keep class com.unity3d.ads.** { *; }
          -keep class com.unity3d.services.** { *; }
          -dontwarn com.unity3d.ads.**
          -dontwarn com.unity3d.services.**
          -keep class com.rebeloid.unity_ads_plugin.** { *; }
          -dontwarn com.rebeloid.unity_ads_plugin.**
          EOF

      - name: Generate Official Release Keystore and Sign APK
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/boykta_release.keystore \
            -alias boyktapro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass boykta2026pro \
            -keypass boykta2026pro \
            -dname "CN=Boykta Pro, OU=Software Development, O=Boykta Technologies, L=Dubai, ST=Dubai, C=AE"
          python3 scripts/configure_keystore.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.5.3"
          RELEASE_TITLE="Boykta Pro v1.5.3 - حل تنزيل الروابط بصوت وصورة + استعادة الإعلانات البينية وظهور البنر فوراً + إزالة شريط يوتيوب"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          cat << 'EOF' > release_notes.md
          🚀 **Boykta Pro v1.5.3** - التحديث الجديد لحل كافة مشاكل تنزيل الروابط والإعلانات والشريط المزعج:

          ### ✨ أبرز التحسينات والإصلاحات في هذا الإصدار (v1.5.3):
          - 🎬 **حل مشكلة تنزيل الروابط صوت فقط (صوت وصورة كاملة 100%):**
            * فحص وتطبيع كودك الفيديو والصوت عبر FFmpeg التوربو لكافة الروابط الخارجية وروابط يوتيوب.
            * منع تشغيل الفيديو كشاشة سوداء على مشغلات أندرويد عبر التأكد من ترميز H.264 (AVC) القياسي مع صوت AAC نقي.
            * تصحيح مسارات استخراج الروابط وعدم خلط ملفات الصوت مع الفيديو.
          - 📢 **استعادة الإعلانات البينية وضمان ظهورها دوماً (Guaranteed Interstitials):**
            * إلغاء التجاوز الذكي المبكر وضمان انتظار جاهزية الإعلان البيني وعرضه بسلاسة.
            * تثبيت معرّف الإعلان المحمّل فعلياً لتفادي تضارب المعرفات أثناء العرض.
            * تجهيز وتحميل إعلان بيني جديد فور إغلاق أي إعلان تلقائياً في الخلفية.
          - ⚡ **ظهور إعلان البنر فوراً بدون أي تعطيل (Instant Banner):**
            * تفعيل وتركيب ويدجت البنر الإعلاني فور تشغيل التطبيق دون أي تأخير أو شروط معلقة.
          - 🔍 **إزالة الشريط المزعج أسفل شريط البحث في يوتيوب:**
            * حذف الحاوية والشريط العائم المفرغ الذي كان يظهر أسفل حقل البحث نهائياً لتوفير تجربة بحث نظيفة وانسيابية.

          📲 **التحميل والتثبيت المباشر:** قم بتحميل وتثبيت ملف `app-release.apk` المرفق أدناه.
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber || true
          else
            gh release create "$TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes-file release_notes.md
          fi
