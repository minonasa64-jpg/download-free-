name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest 

    steps:
      - name: 📥 سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة جافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: 🐦 إعداد بيئة فلاتر (إصدار مستقر)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable' 

      - name: 🏗️ بناء هياكل فلاتر الأساسية مع تحديد الاسم
        run: flutter create --project-name pro_downloader --platforms=android .

      - name: 🌐 حقن جميع الصلاحيات إجبارياً
        run: |
          sed -i '/<manifest xmlns:android=/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

      - name: ⚙️ تحديث إعدادات الأندرويد لـ FFmpeg (MinSDK 24 + MavenCentral)
        run: |
          # 1. رفع الحد الأدنى للنظام إلى 24 لدعم مكتبة دمج الفيديوهات فائقة الدقة
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 24/g' android/app/build.gradle
          
          # 2. إضافة mavenCentral() إجبارياً لتحميل ملفات الدمج بنجاح بدون أخطاء
          sed -i 's/google()/google()\n        mavenCentral()/g' android/build.gradle || true
          sed -i 's/google()/google()\n        mavenCentral()/g' android/settings.gradle || true

      - name: 📦 تحميل الحزم والمكتبات
        run: flutter pub get

      - name: 🔧 الإصلاح السحري لأخطاء المكتبات القديمة
        run: |
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -type f -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} + || true

      - name: 🩹 حل مشكلة تكرار ملفات Kotlin
        run: |
          cat <<EOF >> android/app/build.gradle
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
              }
          }
          EOF

      - name: 🎨 دمج الأيقونة الجديدة
        run: dart run flutter_launcher_icons || true

      - name: 🛠️ بناء ملف APK النهائي
        run: flutter build apk --release

      - name: 📤 رفع ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
