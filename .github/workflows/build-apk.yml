name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create --no-pub --project-name pro_downloader --org com.boykta --platforms=android .

      - name: Safely Inject Manifest and PiP Data
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'com.google.android.gms.permission.AD_ID',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK'
          ]
          for p in perms:
              e = ET.Element('uses-permission')
              e.set('{http://schemas.android.com/apk/res/android}name', p)
              root.insert(0, e)

          # Inject modern targetSdkVersion 34 to avoid Google Play Protect warning
          uses_sdk = root.find('uses-sdk')
          if uses_sdk is None:
              uses_sdk = ET.Element('uses-sdk')
              root.insert(0, uses_sdk)
          uses_sdk.set('{http://schemas.android.com/apk/res/android}minSdkVersion', '24')
          uses_sdk.set('{http://schemas.android.com/apk/res/android}targetSdkVersion', '34')
              
          app = root.find('application')
          if app is not None:
              app.set('{http://schemas.android.com/apk/res/android}largeHeap', 'true')
              app.set('{http://schemas.android.com/apk/res/android}requestLegacyExternalStorage', 'true')
              app.set('{http://schemas.android.com/apk/res/android}usesCleartextTraffic', 'true')
              app.set('{http://schemas.android.com/apk/res/android}hardwareAccelerated', 'true')

              for act in app.findall('activity'):
                  if '{http://schemas.android.com/apk/res/android}taskAffinity' in act.attrib:
                      del act.attrib['{http://schemas.android.com/apk/res/android}taskAffinity']
                  act.set('{http://schemas.android.com/apk/res/android}supportsPictureInPicture', 'true')
                  act.set('{http://schemas.android.com/apk/res/android}configChanges', 'orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode')
              
          tree.write(path, encoding='utf-8', xml_declaration=True)
          "

      - name: Setup FlutterFragmentActivity, PiP and Native MediaMuxer Channels
        run: |
          python3 -c '
          import os

          dir_path = "android/app/src/main/java/com/boykta/pro_downloader"
          os.makedirs(dir_path, exist_ok=True)
          java_code = """package com.boykta.pro_downloader;

          import android.app.PictureInPictureParams;
          import android.media.MediaCodec;
          import android.media.MediaExtractor;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.os.Build;
          import android.util.Log;
          import android.util.Rational;
          import androidx.annotation.NonNull;
          import io.flutter.embedding.android.FlutterFragmentActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;
          import io.flutter.plugins.GeneratedPluginRegistrant;

          import java.io.File;
          import java.nio.ByteBuffer;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends FlutterFragmentActivity {
              private static final String PIP_CHANNEL = "com.boykta.app/pip";
              private static final String MUXER_CHANNEL = "com.boykta.app/media_muxer";
              private static final String TAG = "MainActivity";
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @Override
              public void configureFlutterEngine(@NonNull FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  try {
                      GeneratedPluginRegistrant.registerWith(flutterEngine);
                  } catch (Exception e) {
                      Log.e(TAG, "Plugin registration error: " + e.getMessage());
                  }

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), PIP_CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          if ("enterPip".equals(call.method)) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  try {
                                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                                          .setAspectRatio(new Rational(16, 9))
                                          .build();
                                      enterPictureInPictureMode(params);
                                      result.success(true);
                                  } catch (Exception e) {
                                      result.error("PIP_ERROR", e.getMessage(), null);
                                  }
                              } else {
                                  result.error("NOT_SUPPORTED", "PiP requires Android Oreo (API 26) or higher", null);
                              }
                          } else {
                              result.notImplemented();
                          }
                      });

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), MUXER_CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          if ("muxAudioVideo".equals(call.method)) {
                              final String videoPath = call.argument("videoPath");
                              final String audioPath = call.argument("audioPath");
                              final String outputPath = call.argument("outputPath");

                              if (videoPath == null || audioPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }

                              executor.execute(() -> {
                                  boolean success = muxNativeAudioVideo(videoPath, audioPath, outputPath);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else if ("trimAudio".equals(call.method)) {
                              final String inputPath = call.argument("inputPath");
                              final String outputPath = call.argument("outputPath");
                              final Number startMsNum = call.argument("startMs");
                              final Number endMsNum = call.argument("endMs");

                              if (inputPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }

                              final long startMs = startMsNum != null ? startMsNum.longValue() : 0L;
                              final long endMs = endMsNum != null ? endMsNum.longValue() : Long.MAX_VALUE;

                              executor.execute(() -> {
                                  boolean success = trimNativeAudio(inputPath, outputPath, startMs, endMs);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else if ("extractAudio".equals(call.method)) {
                              final String videoPath = call.argument("videoPath");
                              final String outputPath = call.argument("outputPath");

                              if (videoPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }

                              executor.execute(() -> {
                                  boolean success = extractNativeAudio(videoPath, outputPath);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else {
                              result.notImplemented();
                          }
                      });
              }

              private boolean muxNativeAudioVideo(String videoPath, String audioPath, String outputPath) {
                  MediaExtractor videoExtractor = new MediaExtractor();
                  MediaExtractor audioExtractor = new MediaExtractor();
                  MediaMuxer muxer = null;

                  try {
                      File vFile = new File(videoPath);
                      File aFile = new File(audioPath);
                      if (!vFile.exists() || !aFile.exists()) {
                          Log.e(TAG, "Source files do not exist: v=" + vFile.exists() + ", a=" + aFile.exists());
                          return false;
                      }

                      videoExtractor.setDataSource(videoPath);
                      audioExtractor.setDataSource(audioPath);

                      int videoSourceTrack = -1;
                      for (int i = 0; i < videoExtractor.getTrackCount(); i++) {
                          MediaFormat format = videoExtractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("video/")) {
                              videoSourceTrack = i;
                              break;
                          }
                      }

                      int audioSourceTrack = -1;
                      for (int i = 0; i < audioExtractor.getTrackCount(); i++) {
                          MediaFormat format = audioExtractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioSourceTrack = i;
                              break;
                          }
                      }

                      if (videoSourceTrack == -1 || audioSourceTrack == -1) {
                          Log.e(TAG, "Tracks not found: videoTrack=" + videoSourceTrack + ", audioTrack=" + audioSourceTrack);
                          return false;
                      }

                      File outFile = new File(outputPath);
                      if (outFile.exists()) {
                          outFile.delete();
                      }

                      muxer = new MediaMuxer(outputPath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);

                      videoExtractor.selectTrack(videoSourceTrack);
                      MediaFormat videoFormat = videoExtractor.getTrackFormat(videoSourceTrack);
                      int muxerVideoTrack = muxer.addTrack(videoFormat);

                      audioExtractor.selectTrack(audioSourceTrack);
                      MediaFormat audioFormat = audioExtractor.getTrackFormat(audioSourceTrack);
                      int muxerAudioTrack = muxer.addTrack(audioFormat);

                      muxer.start();

                      int maxBufferSize = 1024 * 1024 * 2;
                      if (videoFormat.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = videoFormat.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }
                      if (audioFormat.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = audioFormat.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }

                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();

                      boolean videoDone = false;
                      boolean audioDone = false;
                      long lastVideoTime = -1;
                      long lastAudioTime = -1;

                      while (!videoDone || !audioDone) {
                          long videoTime = videoDone ? Long.MAX_VALUE : videoExtractor.getSampleTime();
                          long audioTime = audioDone ? Long.MAX_VALUE : audioExtractor.getSampleTime();

                          if (!videoDone && (audioDone || videoTime <= audioTime)) {
                              bufferInfo.offset = 0;
                              bufferInfo.size = videoExtractor.readSampleData(buffer, 0);
                              if (bufferInfo.size < 0) {
                                  videoDone = true;
                              } else {
                                  long sampleTime = videoExtractor.getSampleTime();
                                  if (sampleTime < lastVideoTime) sampleTime = lastVideoTime;
                                  lastVideoTime = sampleTime;

                                  bufferInfo.presentationTimeUs = sampleTime;
                                  bufferInfo.flags = videoExtractor.getSampleFlags();
                                  muxer.writeSampleData(muxerVideoTrack, buffer, bufferInfo);
                                  videoExtractor.advance();
                              }
                          } else if (!audioDone) {
                              bufferInfo.offset = 0;
                              bufferInfo.size = audioExtractor.readSampleData(buffer, 0);
                              if (bufferInfo.size < 0) {
                                  audioDone = true;
                              } else {
                                  long sampleTime = audioExtractor.getSampleTime();
                                  if (sampleTime < lastAudioTime) sampleTime = lastAudioTime;
                                  lastAudioTime = sampleTime;

                                  bufferInfo.presentationTimeUs = sampleTime;
                                  bufferInfo.flags = audioExtractor.getSampleFlags();
                                  muxer.writeSampleData(muxerAudioTrack, buffer, bufferInfo);
                                  audioExtractor.advance();
                              }
                          }
                      }

                      muxer.stop();
                      muxer.release();
                      muxer = null;

                      File finalFile = new File(outputPath);
                      return finalFile.exists() && finalFile.length() > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "Native MediaMuxer error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { videoExtractor.release(); } catch (Exception ignored) {}
                      try { audioExtractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }

              private boolean trimNativeAudio(String inputPath, String outputPath, long startMs, long endMs) {
                  MediaExtractor extractor = new MediaExtractor();
                  MediaMuxer muxer = null;

                  try {
                      extractor.setDataSource(inputPath);
                      int audioSourceTrack = -1;
                      for (int i = 0; i < extractor.getTrackCount(); i++) {
                          MediaFormat format = extractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioSourceTrack = i;
                              break;
                          }
                      }
                      if (audioSourceTrack == -1) return false;

                      extractor.selectTrack(audioSourceTrack);
                      MediaFormat format = extractor.getTrackFormat(audioSourceTrack);

                      File outFile = new File(outputPath);
                      if (outFile.exists()) outFile.delete();

                      muxer = new MediaMuxer(outputPath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      int audioTrackIndex = muxer.addTrack(format);
                      muxer.start();

                      long startUs = startMs * 1000L;
                      long endUs = endMs * 1000L;

                      extractor.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC);

                      int maxBufferSize = 512 * 1024;
                      if (format.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = format.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }

                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();
                      long firstSampleTimeUs = -1;

                      while (true) {
                          bufferInfo.offset = 0;
                          bufferInfo.size = extractor.readSampleData(buffer, 0);
                          if (bufferInfo.size < 0) break;

                          long sampleTimeUs = extractor.getSampleTime();
                          if (sampleTimeUs > endUs) break;

                          if (sampleTimeUs >= startUs) {
                              if (firstSampleTimeUs == -1) {
                                  firstSampleTimeUs = sampleTimeUs;
                              }
                              bufferInfo.presentationTimeUs = sampleTimeUs - firstSampleTimeUs;
                              bufferInfo.flags = extractor.getSampleFlags();
                              muxer.writeSampleData(audioTrackIndex, buffer, bufferInfo);
                          }
                          extractor.advance();
                      }

                      muxer.stop();
                      muxer.release();
                      muxer = null;

                      File finalFile = new File(outputPath);
                      return finalFile.exists() && finalFile.length() > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "trimNativeAudio error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { extractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }

              private boolean extractNativeAudio(String videoPath, String outputPath) {
                  MediaExtractor extractor = new MediaExtractor();
                  MediaMuxer muxer = null;

                  try {
                      extractor.setDataSource(videoPath);
                      int audioSourceTrack = -1;
                      for (int i = 0; i < extractor.getTrackCount(); i++) {
                          MediaFormat format = extractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioSourceTrack = i;
                              break;
                          }
                      }
                      if (audioSourceTrack == -1) {
                          Log.e(TAG, "No audio track found in video: " + videoPath);
                          return false;
                      }

                      extractor.selectTrack(audioSourceTrack);
                      MediaFormat format = extractor.getTrackFormat(audioSourceTrack);

                      File outFile = new File(outputPath);
                      if (outFile.exists()) outFile.delete();

                      muxer = new MediaMuxer(outputPath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      int audioTrackIndex = muxer.addTrack(format);
                      muxer.start();

                      int maxBufferSize = 1024 * 1024;
                      if (format.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = format.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }

                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();

                      while (true) {
                          bufferInfo.offset = 0;
                          bufferInfo.size = extractor.readSampleData(buffer, 0);
                          if (bufferInfo.size < 0) break;

                          bufferInfo.presentationTimeUs = extractor.getSampleTime();
                          bufferInfo.flags = extractor.getSampleFlags();
                          muxer.writeSampleData(audioTrackIndex, buffer, bufferInfo);
                          extractor.advance();
                      }

                      muxer.stop();
                      muxer.release();
                      muxer = null;

                      File finalFile = new File(outputPath);
                      return finalFile.exists() && finalFile.length() > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "extractNativeAudio error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { extractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }
          }
          """
          with open(os.path.join(dir_path, "MainActivity.java"), "w") as f:
              f.write(java_code)
          '
          find android/app/src/main -name "MainActivity.kt" -exec rm -f {} +

      - name: Apply FFmpeg Resolution Strategy and Build Fixes
        run: |
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'com.arthenica' || details.requested.group == 'dev.ffmpegkit-maintained') {
                          details.useTarget group: 'dev.ffmpegkit-maintained', name: 'ffmpeg-kit-full', version: '8.1.7'
                      }
                  }
              }
          }
          EOF
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "com\.android\.application" version "[0-9.]+"/id "com.android.application" version "7.4.2"/g' android/settings.gradle || true
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext\.kotlin_version\s*=\s*'[^']+'/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true
            sed -i -E "s/kotlin-gradle-plugin:[0-9.]+/kotlin-gradle-plugin:2.0.21/g" android/build.gradle || true
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/g" android/build.gradle || true
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E 's/gradle-[0-9.]+-all\.zip/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdkVersion\s+[0-9]+/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdkVersion\s+flutter\.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minifyEnabled\s+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i -E 's/shrinkResources\s+true/shrinkResources false/g' android/app/build.gradle || true
            echo 'tasks.whenTaskAdded { task -> if (task.name.toLowerCase().contains("aarmetadata")) { task.enabled = false } }' >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/targetSdk\s*=\s*[0-9]+/targetSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -dontwarn io.flutter.embedding.**
          -keep class io.flutter.plugins.GeneratedPluginRegistrant { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          -keep class dev.ffmpegkit.** { *; }
          -dontwarn dev.ffmpegkit.**
          -keep class * implements io.flutter.embedding.engine.plugins.FlutterPlugin { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }
          -keep class com.unity3d.ads.** { *; }
          -keep class com.unity3d.services.** { *; }
          -dontwarn com.unity3d.ads.**
          -dontwarn com.unity3d.services.**
          -keep class com.rebeloid.unity_ads_plugin.** { *; }
          -dontwarn com.rebeloid.unity_ads_plugin.**
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4.1"
          RELEASE_TITLE="Boykta Pro v1.4.1 - تحديث Target SDK 34، تحسين مشغل يوتيوب والموسيقى بالخلفية، وإصلاح إنستغرام واللغات"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          NOTES="🚀 **Boykta Pro v1.4.1** - ترقية شاملة للحماية، توافق أندرويد الحديث، وتشغيل الموسيقى في الخلفية!

          ### ✨ الجديد والمُحدث في إصدار v1.4.1:
          - 🛡️ **ترقية نظام الحماية والتوافق مع Android 14/15 (Target SDK 34):**
            * تم تحديد Target SDK و Compile SDK إلى 34 لحل رسالة تحذير حماية Google Play نهائياً.
            * إضافة صلاحية تشغيل الوسائط في الخلفية الحديثة (FOREGROUND_SERVICE_MEDIA_PLAYBACK).
          - 🎬 **تطوير وسرعة استجابة مشغل فيديو يوتيوب:**
            * استجابة فورية بدون بطء مع تحسين اختيار تيار البث الأمثل وتجنب التقطيع.
            * تنقية خلاصة البداية بمحتوى راقٍ، مريح وممتع (وثائقيات، طبيعة خلابة، تقنية راقية) خالٍ تماماً من المحتوى غير اللائق أو الإباحي.
            * إزالة شريط التصنيفات السابق لتوفير مساحة رؤية كاملة ونقية ومريحة للمستخدم.
          - 🎵 **تشغيل الموسيقى في الخلفية (Background Audio Playback):**
            * استمرار عمل مشغل الموسيقى عند الخروج من التطبيق أو قفل الشاشة مع دعم كامل لصلاحيات WAKE_LOCK و AudioFocus.
            * مشغل مصغر مريح وسلس وأزرار تحكم كاملة.
          - 🌐 **إصلاح شامل لكافة النصوص غير المترجمة في اللغات:**
            * تعريب وترجمة شاشات الإعدادات والروابط بالكامل لتتوافق 100% فورياً عند تبديل اللغة (زر اللصق، عناوين الخزنة، التنزيل التوربو، وغيرها).
            * إعادة بناء الواجهة فورياً عند اختيار أي لغة من اللغات السبع المدعومة.
          - 📸 **حل جذري ودعم فائق لتحميل ريلز وفيديوهات إنستغرام:**
            * محرك استخراج متوازي ذكي يدمج بين Instagram OEmbed و APIs سريعة ومتعددة لحل مشكلة تعليق التحميل.
          - 💎 **جاهزية واستقرار الإعلانات (Unity Ads):**
            * نظام إعلانات ذكي مع تحكم بتردد الإعلانات لحماية تجربة المستخدم وجاهزية تامة لآلاف المستخدمين.
          - ⚡ الحفاظ التام والكامل على كافة ميزات التنزيل التوربو (16 مسار)، الخزنة المشفرة، المشاركة عبر Wi-Fi، وصانع النغمات.

          📲 **التثبيت المباشر:** قم بتحميل ملف \`app-release.apk\` المرفق أدناه وتثبيته مباشرة على هاتفك الأندرويد."

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber || true
          else
            gh release create "$TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$NOTES"
          fi
