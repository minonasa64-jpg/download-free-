name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create --no-pub --project-name pro_downloader --org com.boykta --platforms=android .

      - name: Safely Inject Manifest and PiP Data
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'com.google.android.gms.permission.AD_ID',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC'
          ]
          for p in perms:
              e = ET.Element('uses-permission')
              e.set('{http://schemas.android.com/apk/res/android}name', p)
              root.insert(0, e)
              
          app = root.find('application')
          if app is not None:
              app.set('{http://schemas.android.com/apk/res/android}largeHeap', 'true')
              app.set('{http://schemas.android.com/apk/res/android}requestLegacyExternalStorage', 'true')

              for act in app.findall('activity'):
                  if '{http://schemas.android.com/apk/res/android}taskAffinity' in act.attrib:
                      del act.attrib['{http://schemas.android.com/apk/res/android}taskAffinity']
                  act.set('{http://schemas.android.com/apk/res/android}supportsPictureInPicture', 'true')
                  act.set('{http://schemas.android.com/apk/res/android}configChanges', 'orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode')
              
          tree.write(path, encoding='utf-8', xml_declaration=True)
          "

      - name: Setup FlutterFragmentActivity and PiP Channel
        run: |
          python3 -c '
          import os

          dir_path = "android/app/src/main/java/com/boykta/pro_downloader"
          os.makedirs(dir_path, exist_ok=True)
          java_code = """package com.boykta.pro_downloader;

          import android.app.PictureInPictureParams;
          import android.os.Build;
          import android.util.Rational;
          import androidx.annotation.NonNull;
          import io.flutter.embedding.android.FlutterFragmentActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;
          import io.flutter.plugins.GeneratedPluginRegistrant;

          public class MainActivity extends FlutterFragmentActivity {
              private static final String CHANNEL = "com.boykta.app/pip";

              @Override
              public void configureFlutterEngine(@NonNull FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  try {
                      GeneratedPluginRegistrant.registerWith(flutterEngine);
                  } catch (Exception e) {
                      android.util.Log.e("MainActivity", "Plugin registration error: " + e.getMessage());
                  }

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          if ("enterPip".equals(call.method)) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  try {
                                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                                          .setAspectRatio(new Rational(16, 9))
                                          .build();
                                      enterPictureInPictureMode(params);
                                      result.success(true);
                                  } catch (Exception e) {
                                      result.error("PIP_ERROR", e.getMessage(), null);
                                  }
                              } else {
                                  result.error("NOT_SUPPORTED", "PiP requires Android Oreo (API 26) or higher", null);
                              }
                          } else {
                              result.notImplemented();
                          }
                      });
              }
          }
          """
          with open(os.path.join(dir_path, "MainActivity.java"), "w") as f:
              f.write(java_code)
          '
          find android/app/src/main -name "MainActivity.kt" -exec rm -f {} +

      - name: Apply FFmpeg Resolution Strategy and Build Fixes
        run: |
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'com.arthenica' || details.requested.group == 'dev.ffmpegkit-maintained') {
                          details.useTarget group: 'dev.ffmpegkit-maintained', name: 'ffmpeg-kit-full', version: '8.1.7'
                      }
                  }
              }
          }
          EOF
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "com\.android\.application" version "[0-9.]+"/id "com.android.application" version "7.4.2"/g' android/settings.gradle || true
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext\.kotlin_version\s*=\s*'[^']+'/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true
            sed -i -E "s/kotlin-gradle-plugin:[0-9.]+/kotlin-gradle-plugin:2.0.21/g" android/build.gradle || true
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/g" android/build.gradle || true
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E 's/gradle-[0-9.]+-all\.zip/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minifyEnabled\s+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i -E 's/shrinkResources\s+true/shrinkResources false/g' android/app/build.gradle || true
            echo 'tasks.whenTaskAdded { task -> if (task.name.toLowerCase().contains("aarmetadata")) { task.enabled = false } }' >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -dontwarn io.flutter.embedding.**
          -keep class io.flutter.plugins.GeneratedPluginRegistrant { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -dontwarn com.arthenica.ffmpegkit.**
          -keep class * implements io.flutter.embedding.engine.plugins.FlutterPlugin { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }
          -keep class com.unity3d.ads.** { *; }
          -keep class com.unity3d.services.** { *; }
          -dontwarn com.unity3d.ads.**
          -dontwarn com.unity3d.services.**
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.4"
          RELEASE_TITLE="Boykta Pro v1.3.4 - ترقية وتفعيل جودة الفيديو إلى 1080p Full HD كخيار أساسي فائق الدقة"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          NOTES="🚀 **Boykta Pro v1.3.4** - رفع دقة التحميل إلى أقصى جودة ممكنة (1080p Full HD) عبر الرابط!

          ### ✨ أبرز ما في هذا التحديث:
          - 💎 **ترقية جودة الفيديو إلى 1080p Full HD:** تمكين وتفعيل أعلى جودة متاحة 1080p FHD ووضعها في أعلى قائمة الخيارات وتحديدها تلقائياً عند لصق الرابط.
          - 🎯 **اختيار ذكي وفوري:** ترتيب الجودات تنازلياً بحيث تظهر 1080p Full HD فوراً للمستخدم بدون الحاجة للبحث، مع تمييزها بشارة FHD المضيئة.
          - ⚡ **دعم التنزيل الدفعي بدقة 1080p:** تحديث التنزيل الدفعي وقوائم التشغيل لاختيار 1080p FHD افتراضياً بدلاً من التقيد بـ 720p.
          - 🎬 **تطوير محرك دمج الصوت والصورة:** دعم مسارات 1080p المدمجة عالية النقاء بتوافق تام مع مشغلات الأندرويد واستديو الصور.
          - 🎮 **نظام إعلانات Unity Ads:** استمرار العمل الكامل لإعلانات Unity Ads الرسمية.
          - 🛡️ **الحفاظ على كافة الميزات السابقة:** الخزنة الآمنة، متصفح ملء الشاشة، مشغل PiP، ووضع التوربو.
          
          📲 **التثبيت المباشر:** قم بتحميل ملف \`app-release.apk\` المرفق أدناه وتثبيته مباشرة على هاتفك الأندرويد."

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber || true
          else
            gh release create "$TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$NOTES"
          fi
