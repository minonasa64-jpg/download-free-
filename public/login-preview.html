<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form UI | CodeByGaurav</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ebf0f5;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Floating Neumorphic Spheres in background */
        .bg-sphere {
            position: fixed;
            border-radius: 50%;
            background: #ebf0f5;
            box-shadow: 14px 14px 28px #caced1, -14px -14px 28px #ffffff;
            z-index: -1;
            animation: floatAnim 5s ease-in-out infinite alternate;
        }
        .sp1 { width: 170px; height: 170px; top: 8%; left: 8%; }
        .sp2 { width: 130px; height: 130px; bottom: 8%; right: 8%; animation-delay: 2s; }
        .sp3 { width: 60px; height: 60px; top: 25%; right: 22%; animation-delay: 1s; }

        @keyframes floatAnim {
            0% { transform: translateY(0); }
            100% { transform: translateY(-16px); }
        }

        .auth-wrapper {
            width: 390px;
            max-width: 100%;
            perspective: 1500px;
        }

        .auth-card {
            position: relative;
            width: 100%;
            min-height: 620px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .auth-card.flipped {
            transform: rotateY(180deg);
        }

        .form-panel {
            position: absolute;
            inset: 0;
            padding: 32px 28px;
            border-radius: 38px;
            background: #ebf0f5;
            box-shadow: 16px 16px 32px #caced1, -16px -16px 32px #ffffff;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signup-panel {
            transform: rotateY(180deg);
        }

        /* Logo Area */
        .logo-box {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #ebf0f5;
            box-shadow: 8px 8px 16px #caced1, -8px -8px 16px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo-box .inner-badge {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ebf0f5;
            box-shadow: inset 2px 2px 5px #caced1, inset -2px -2px 5px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .logo-lock { color: #f59e0b; }
        .logo-user { color: #0066cc; }

        h1 {
            color: #2d3748;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 3px;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 22px;
            text-align: center;
        }

        form {
            width: 100%;
        }

        .field-group {
            margin-bottom: 15px;
            width: 100%;
        }

        .field-group label {
            display: block;
            color: #2d3748;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .input-inset {
            position: relative;
            width: 100%;
            height: 48px;
            border-radius: 16px;
            background: #ebf0f5;
            box-shadow: inset 3px 3px 6px #caced1, inset -3px -3px 6px #ffffff;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .input-inset:focus-within {
            border-color: #00aaff;
            box-shadow: inset 2px 2px 5px #caced1, inset -2px -2px 5px #ffffff, 0 0 10px rgba(0, 170, 255, 0.25);
        }

        .input-inset i.prefix-icon {
            color: #718096;
            font-size: 15px;
            margin-right: 10px;
        }

        .input-inset input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #2d3748;
            font-size: 13.5px;
            font-weight: 500;
        }

        .input-inset input::placeholder {
            color: #a0aec0;
            font-size: 13px;
        }

        .pass-toggle {
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
        }

        .pass-toggle:hover {
            color: #0066cc;
        }

        /* Options Row */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 2px 18px;
            font-size: 12.5px;
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #718096;
            cursor: pointer;
        }

        .remember-wrap input[type="checkbox"] {
            accent-color: #0066cc;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Neumorphic Buttons */
        .btn-neo {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 16px;
            background: #ebf0f5;
            color: #0066cc;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 6px 6px 14px #caced1, -6px -6px 14px #ffffff;
            transition: all 0.2s ease;
        }

        .btn-neo:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 18px #caced1, -8px -8px 18px #ffffff;
            color: #0052a3;
        }

        .btn-neo:active {
            transform: translateY(1px);
            box-shadow: inset 3px 3px 6px #caced1, inset -3px -3px 6px #ffffff;
        }

        /* Switch row */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
            font-size: 12.5px;
            color: #718096;
        }

        .btn-switch-circle {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #ebf0f5;
            color: #0066cc;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 8px #caced1, -4px -4px 8px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.25s ease;
        }

        .btn-switch-circle:hover {
            transform: scale(1.08) rotate(90deg);
            background: #0066cc;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.35);
        }

        /* Social Icons Row */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 4px;
        }

        .btn-social {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #ebf0f5;
            cursor: pointer;
            box-shadow: 5px 5px 10px #caced1, -5px -5px 10px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 7px 7px 14px #caced1, -7px -7px 14px #ffffff;
        }

        .btn-social.google { color: #ea4335; }
        .btn-social.facebook { color: #1877f2; }
        .btn-social.linkedin { color: #0a66c2; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            font-size: 13.5px;
            font-weight: 600;
            transition: transform 0.4s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div class="bg-sphere sp1"></div>
    <div class="bg-sphere sp2"></div>
    <div class="bg-sphere sp3"></div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">تم تسجيل الدخول بنجاح!</span>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- 1. LOGIN PANEL (Welcome) -->
            <div class="form-panel login-panel">
                <div class="logo-box">
                    <div class="inner-badge">
                        <i class="fa-solid fa-lock logo-lock"></i>
                    </div>
                </div>

                <h1>Welcome</h1>
                <p class="subtitle">Login to continue your journey</p>

                <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                    <!-- Email -->
                    <div class="field-group">
                        <label>Email Address</label>
                        <div class="input-inset">
                            <i class="fa-regular fa-envelope prefix-icon"></i>
                            <input type="email" placeholder="gaurav@gmail.com" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="field-group">
                        <label>Password</label>
                        <div class="input-inset">
                            <i class="fa-solid fa-lock prefix-icon"></i>
                            <input type="password" id="loginPass" placeholder="••••••" required>
                            <button type="button" class="pass-toggle" onclick="togglePass('loginPass', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="options-row">
                        <label class="remember-wrap">
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="showToast('تم إرسال رابط استعادة كلمة المرور'); return false;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-neo">LOGIN</button>
                </form>

                <div class="switch-row">
                    <span>Don't have an account?</span>
                    <button type="button" class="btn-switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <!-- Social Icons G, f, in -->
                <div class="social-row">
                    <button class="btn-social google" title="Google Sign-In" onclick="showToast('تم تسجيل الدخول بحساب Google!')">
                        <i class="fa-brands fa-google"></i>
                    </button>
                    <button class="btn-social facebook" title="Facebook" onclick="showToast('تم تسجيل الدخول بحساب Facebook!')">
                        <i class="fa-brands fa-facebook-f"></i>
                    </button>
                    <button class="btn-social linkedin" title="LinkedIn" onclick="showToast('تم تسجيل الدخول بحساب LinkedIn!')">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </button>
                </div>
            </div>

            <!-- 2. SIGNUP PANEL (Create Account) -->
            <div class="form-panel signup-panel">
                <div class="logo-box">
                    <div class="inner-badge">
                        <i class="fa-solid fa-user logo-user"></i>
                    </div>
                </div>

                <h1>Create Account</h1>
                <p class="subtitle">Sign up to get started</p>

                <form id="signupForm" onsubmit="handleSignupSubmit(event)">
                    <!-- Full Name -->
                    <div class="field-group">
                        <label>Full Name</label>
                        <div class="input-inset">
                            <i class="fa-regular fa-user prefix-icon"></i>
                            <input type="text" placeholder="Enter your name" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="field-group">
                        <label>Email Address</label>
                        <div class="input-inset">
                            <i class="fa-regular fa-envelope prefix-icon"></i>
                            <input type="email" placeholder="gaurav@gmail.com" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="field-group">
                        <label>Password</label>
                        <div class="input-inset">
                            <i class="fa-solid fa-lock prefix-icon"></i>
                            <input type="password" id="signupPass" placeholder="••••••" required>
                            <button type="button" class="pass-toggle" onclick="togglePass('signupPass', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="field-group">
                        <label>Confirm Password</label>
                        <div class="input-inset">
                            <i class="fa-solid fa-lock prefix-icon"></i>
                            <input type="password" id="confirmPass" placeholder="••••••" required>
                            <button type="button" class="pass-toggle" onclick="togglePass('confirmPass', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="options-row">
                        <label class="remember-wrap">
                            <input type="checkbox" checked required>
                            <span>I agree to the <b style="color: #0066cc;">Terms & Conditions</b></span>
                        </label>
                    </div>

                    <button type="submit" class="btn-neo">SIGN UP</button>
                </form>

                <div class="switch-row">
                    <span>Already have an account?</span>
                    <button type="button" class="btn-switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function flipCard() {
            document.getElementById("authCard").classList.toggle("flipped");
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector("i");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            showToast("✓ تم تسجيل الدخول بنجاح!");
        }

        function handleSignupSubmit(e) {
            e.preventDefault();
            showToast("✓ تم إنشاء الحساب وتسجيل الدخول بنجاح!");
        }
    </script>
</body>
</html>
